spring.application.name=music-catalog
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration - H2 for local development
# Use native H2 mode locally so H2 functions (e.g. RANDOM_UUID()) are available.
spring.datasource.url=jdbc:h2:mem:musiccatalog;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# Disable Flyway in local dev to avoid running Postgres-specific migrations against H2
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.example.musiccatalog=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
app.jwt.secret=MusicCatalogInsightsPlatformSecretKeyForJWTTokenGeneration2026
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# iTunes API Configuration
itunes.api.baseurl=https://itunes.apple.com

# Caching (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=15m

# CORS Configuration
app.cors.allowedOrigins=http://localhost:3000,http://localhost:3001,https://yourdomain.com
app.cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowedHeaders=*
app.cors.allowCredentials=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
