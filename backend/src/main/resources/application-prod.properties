spring.application.name=music-catalog
spring.profiles.active=prod

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.min-response-size=1024

# Database Configuration - PostgreSQL (Production)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.auto-commit=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging (Production - WARN level)
logging.level.root=WARN
logging.level.com.example.musiccatalog=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# iTunes API Configuration
itunes.api.baseurl=https://itunes.apple.com

# Caching (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=15m

# CORS Configuration
app.cors.allowedOrigins=${CORS_ORIGINS:https://music-catalog.vercel.app}
app.cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowedHeaders=*
app.cors.allowCredentials=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.db.enabled=true

# Flyway: point to Postgres migrations in production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgres

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false
